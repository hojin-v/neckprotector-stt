[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sori-dictation"
version = "0.2.0"
description = "소리 — local desktop dictation with a daily voice journal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "pynput>=1.7.7,<2",
  "regex>=2024.11",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
asr = ["torch>=2.4,<3", "transformers>=5.13,<6", "accelerate>=1.2,<2", "librosa>=0.11,<1", "soundfile>=0.13,<1"]
asr-cuda = ["torch>=2.4,<3", "transformers>=5.13,<6", "accelerate>=1.2,<2", "librosa>=0.11,<1", "soundfile>=0.13,<1"]
build = ["pyinstaller>=6.11,<7"]

[tool.uv]
conflicts = [[{ extra = "asr" }, { extra = "asr-cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "asr", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "asr-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
sori = "sori.app:main"

[tool.setuptools.packages.find]
include = ["sori*"]

[tool.setuptools.package-data]
sori = ["assets/*.svg", "assets/*.ico"]
